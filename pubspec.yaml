name: fello
description: Kaydo — collect feedback with shareable forms and a clear org dashboard.
publish_to: "none"
version: 1.2.2+7
environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  go_router: ^16.0.0
  get_it: ^8.0.3
  google_fonts: ^6.2.1
  intl: ^0.20.2
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  fl_chart: ^1.0.0
  supabase_flutter: ^2.9.1
  url_launcher: ^6.3.1
  collection: ^1.19.1
  crypto: ^3.0.6
  pdf: ^3.12.0
  excel: ^4.0.6
  web: ^1.1.2
  file_picker: ^8.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/auth_panel.jpg
    - assets/images/auth_panel_signup.jpg
    - assets/images/kaydo_logo.png
    - assets/images/sayge_logo.png
